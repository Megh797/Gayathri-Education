{% extends "base.html" %}
{% block title %}Attendance History{% endblock %}

{% block content %}
<a class="btn btn-secondary btn-sm mb-3" href="{{ url_for('student_portal') }}">
  <i class="bi bi-arrow-left"></i> Go Back
</a>

<h4 class="text-primary mb-3">Attendance History</h4>

{% if attendance %}
  <table class="table table-striped table-bordered shadow-sm">
    <thead class="table-light">
      <tr><th>Date</th><th>Status</th></tr>
    </thead>
    <tbody>
      {% for a in attendance %}
      <tr>
        <td>{{ a.date }}</td>
        <td>{{ a.status }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
{% else %}
  <div class="card p-3 text-center text-muted">No attendance records found.</div>
{% endif %}
{% endblock %}
