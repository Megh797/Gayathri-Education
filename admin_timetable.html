{% extends "base.html" %}
{% block content %}
<div class="container mt-4">

<h3 class="fw-bold text-primary mb-3">📅 Upload Timetable</h3>

<form method="POST" enctype="multipart/form-data" class="card p-3 shadow">
    
    <label class="fw-bold">Select Class</label>
    <select name="class_id" class="form-select mb-2" required>
        <option value="">Select Class</option>
        {% for c in classes %}
        <option value="{{ c.id }}">{{ c.name }}</option>
        {% endfor %}
    </select>

    <label class="fw-bold">Upload Timetable (PDF/JPG/PNG)</label>
    <input type="file" name="file" class="form-control mb-3" accept=".pdf,.png,.jpg,.jpeg" required>

    <button class="btn btn-primary">Upload</button>
</form>

<hr>

<h4 class="fw-bold text-secondary">📂 Uploaded Timetables</h4>

<table class="table table-hover mt-3 bg-white shadow-sm">
<thead class="table-light">
<tr>
<th>Class</th>
<th>File</th>
<th>Uploaded On</th>
</tr>
</thead>
<tbody>
{% for t in timetables %}
<tr>
<td>{{ t.class_name }}</td>
<td>
<a href="{{ url_for('static', filename='uploads/timetable/' ~ t.file_name) }}" target="_blank"
class="btn btn-sm btn-outline-primary">View</a>
</td>
<td>{{ t.uploaded_on }}</td>
</tr>
{% endfor %}
</tbody>
</table>

</div>
{% endblock %}
