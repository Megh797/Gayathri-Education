{% extends "base.html" %}
{% block title %}Manage Students{% endblock %}
{% block content %}

<a class="btn btn-secondary btn-sm mb-3" href="{{ url_for('admin_dashboard') }}">
  <i class="bi bi-arrow-left"></i> Back
</a>

<h3 class="fw-bold text-primary mb-3">Manage Students</h3>

<form method="get" class="row mb-3">
  <div class="col-md-4">
    <select name="class_id" class="form-select" onchange="this.form.submit()">
      <option value="">Select Class</option>
      {% for c in classes %}
      <option value="{{ c.id }}" {% if class_id == c.id|string %}selected{% endif %}>{{ c.name }}</option>
      {% endfor %}
    </select>
  </div>
</form>

<!-- Add Student -->
<div class="card shadow-sm p-3 mb-4">
  <h5 class="mb-3">Add Student</h5>
  <form method="POST">
    <div class="row g-2">
      <div class="col-md-3"><input class="form-control" name="name" placeholder="Student Name" required></div>
      <div class="col-md-2">
        <select name="class_id" class="form-select" required>
          <option value="">Class</option>
          {% for c in classes %}
          <option value="{{ c.id }}">{{ c.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-3"><input class="form-control" name="father" placeholder="Father Name"></div>
      <div class="col-md-2"><input class="form-control" name="parent_contact" placeholder="Parent Contact"></div>
      <div class="col-md-2"><button class="btn btn-primary w-100">Add</button></div>
    </div>
  </form>
</div>

<table class="table table-striped shadow-sm">
  <thead class="table-primary">
    <tr>
      <th>Name</th>
      <th>Class</th>
      <th>Contact</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody>
    {% for s in students %}
    <tr>
      <td>{{ s.name }}</td>
      <td>{{ s.class_name }}</td>
      <td>{{ s.parent_contact }}</td>
      <td>
        <form method="POST" action="{{ url_for('admin_student_delete', id=s.id) }}">
          <button class="btn btn-danger btn-sm"><i class="bi bi-trash"></i></button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>

{% endblock %}
