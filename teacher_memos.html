{% extends "base.html" %}
{% block title %}Send Notice | Gayathri Vidyalaya{% endblock %}

{% block content %}
<div class="container mt-4">

    <h3 class="fw-bold text-primary mb-3"><i class="bi bi-megaphone me-2"></i> Send Class Notice</h3>

    <div class="card shadow-lg rounded-4 p-4">

        <form method="POST">

            <div class="row g-3">

                <div class="col-md-4">
                    <label class="form-label">Select Class</label>
                    <select name="class_id" class="form-select" required>
                        {% for c in classes %}
                        <option value="{{ c.id }}">{{ c.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-8">
                    <label class="form-label">Message</label>
                    <textarea name="message" rows="3" class="form-control" required></textarea>
                </div>

                <div class="col-12">
                    <button class="btn btn-warning w-100 shadow-sm">
                        <i class="bi bi-send"></i> Send Notice
                    </button>
                </div>

            </div>

        </form>
    </div>

</div>
{% endblock %}
